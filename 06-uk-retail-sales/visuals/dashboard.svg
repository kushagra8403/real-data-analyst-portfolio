<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700"><rect width="1200" height="700" fill="#f7f8fa"/><g font-family="Arial"><text x="50" y="55" font-size="30" font-weight="700">Great Britain Retail Sales</text><text x="50" y="85" font-size="16">ONS Retail Sales Index • July 2026</text><rect x="50" y="120" width="250" height="110" fill="white" stroke="#ddd"/><text x="70" y="155">Monthly volume</text><text x="70" y="205" font-size="32" font-weight="700">-0.5%</text><rect x="325" y="120" width="250" height="110" fill="white" stroke="#ddd"/><text x="345" y="155">Year-on-year</text><text x="345" y="205" font-size="32" font-weight="700">+1.6%</text><rect x="600" y="120" width="250" height="110" fill="white" stroke="#ddd"/><text x="620" y="155">3-month growth</text><text x="620" y="205" font-size="32" font-weight="700">+1.1%</text><rect x="875" y="120" width="250" height="110" fill="white" stroke="#ddd"/><text x="895" y="155">Online share</text><text x="895" y="205" font-size="32" font-weight="700">28.3%</text><rect x="50" y="270" width="1075" height="340" fill="white" stroke="#ddd"/><text x="75" y="310" font-size="20" font-weight="700">July 2026 retail demand</text><text x="75" y="365" font-size="18">Sales volumes fell 0.5% over the month</text><text x="75" y="410" font-size="18">Volumes remained 1.6% above July 2025</text><text x="75" y="455" font-size="18">Online spending values were 6.5% above July 2025</text><text x="75" y="500" font-size="18">Online share fell from 29.2% in June to 28.3% in July</text><text x="75" y="555" font-size="15">Source: ONS Retail Sales, Great Britain: July 2026</text></g></svg>