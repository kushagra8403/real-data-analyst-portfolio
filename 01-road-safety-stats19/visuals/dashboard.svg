<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700"><rect width="1200" height="700" fill="#f7f8fa"/><g font-family="Arial"><text x="50" y="55" font-size="30" font-weight="700">Road Safety Analytics — STATS19</text><text x="50" y="85" font-size="16">Great Britain • 2025 final validated data</text><g font-weight="700"><rect x="50" y="120" width="330" height="110" fill="white" stroke="#ddd"/><text x="75" y="155">Fatalities</text><text x="75" y="205" font-size="34">1,538</text><rect x="405" y="120" width="330" height="110" fill="white" stroke="#ddd"/><text x="430" y="155">KSI casualties</text><text x="430" y="205" font-size="34">29,918</text><rect x="760" y="120" width="365" height="110" fill="white" stroke="#ddd"/><text x="785" y="155">All casualties</text><text x="785" y="205" font-size="34">127,883</text></g><rect x="50" y="270" width="1075" height="340" fill="white" stroke="#ddd"/><text x="75" y="310" font-size="20" font-weight="700">2025 published outcome</text><text x="75" y="355" font-size="17">Fatalities: 4% lower than 2024</text><text x="75" y="395" font-size="17">KSI casualties: 4% higher than 2024</text><text x="75" y="435" font-size="17">All casualties: broadly unchanged from 2024</text><text x="75" y="500" font-size="15">Source: Department for Transport, Reported Road Casualties Great Britain: final results 2025</text></g></svg>